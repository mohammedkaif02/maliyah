name: maliyah
description: "MĀLIYAH — An ultra-premium, privacy-first personal wealth & expense management app built with Flutter, Material 3, and BLoC."
publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  google_mlkit_text_recognition: ^0.14.0
  flutter_svg: ^2.0.10+1
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator:
  build_runner:
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "asset/launch_icon.png"
  min_sdk_android: 21 
  web:
    generate: true
    image_path: "asset/launch_icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true  
    image_path: "asset/launch_icon.png"
    icon_size: 48 
  macos:
    generate: true
    image_path: "asset/launch_icon.png"

flutter:

  
  uses-material-design: true

  assets:
    - asset/

